services:
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: todo-php
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - todo-network
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      # Trusted proxies for X-Forwarded-* headers (required for path prefix handling)
      - TRUSTED_PROXIES=127.0.0.1

  web:
    image: nginx:1.24-alpine
    container_name: todo-nginx
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - todo-network

  db:
    image: postgres:15-alpine
    container_name: todo-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Ports are not exposed by default (services communicate via internal network)
    # In development, you can expose with Docker volume mounts for tools access
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo_user} -d ${POSTGRES_DB:-todo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: todo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Ports are not exposed by default (services communicate via internal network)
    # In development, you can expose with: docker compose -p todo-me --profile dev up
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    container_name: todo-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8000"
    env_file:
      - .env.mcp
    environment:
      - TODO_API_URL=http://web:80
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    networks:
      - todo-network
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  todo-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
